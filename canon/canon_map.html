<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeopardy! Canon Knowledge Map</title>
<style>
  :root {
    --bg: #0a1128; --panel: #131f45; --panel2: #1a2a5e; --border: #2a3a72;
    --ink: #f2f4fb; --ink2: #b8c2e0; --muted: #7c89b4;
    --gold: #e8b70e; --gold-dim: #a8850b;
    --good: #4cc38a; --bad: #ec8b81; --neutral: #8fa0c9;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 2px solid var(--gold); padding: 10px 20px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  header h1 { font-size: 19px; letter-spacing: .5px; color: var(--gold); white-space: nowrap; }
  nav { display: flex; gap: 4px; }
  nav a {
    padding: 5px 12px; border-radius: 6px; color: var(--ink2); font-weight: 600; font-size: 14px;
  }
  nav a.active, nav a:hover { background: var(--panel2); color: var(--ink); text-decoration: none; }
  #searchwrap { position: relative; flex: 1; min-width: 220px; max-width: 420px; margin-left: auto; }
  #search {
    width: 100%; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink); font-size: 14px; outline: none;
  }
  #search:focus { border-color: var(--gold); }
  #suggest {
    position: absolute; top: 38px; left: 0; right: 0; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; max-height: 420px;
    overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #suggest .sg { padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #suggest .sg:hover, #suggest .sg.sel { background: var(--panel); }
  #suggest .sg small { color: var(--muted); white-space: nowrap; }
  main { max-width: 1060px; margin: 0 auto; padding: 22px 20px 80px; }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  h2 { font-size: 24px; margin-bottom: 4px; }
  h3 { font-size: 16px; color: var(--ink2); margin: 22px 0 8px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; transition: border-color .12s;
  }
  .card:hover { border-color: var(--gold); }
  .card b { font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .sharebar { height: 5px; background: var(--panel2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .sharebar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase;
       letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid #1d2b57; vertical-align: top; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: var(--panel); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .badge {
    display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600;
  }
  .badge.rising   { background: rgba(76,195,138,.15); color: var(--good); }
  .badge.declining{ background: rgba(236,139,129,.15); color: var(--bad); }
  .badge.stable   { background: rgba(143,160,201,.14); color: var(--neutral); }
  .chip {
    display: inline-block; background: var(--panel2); border: 1px solid var(--border);
    padding: 2px 10px; border-radius: 12px; font-size: 12.5px; margin: 0 6px 6px 0; color: var(--ink2);
  }
  a.chip:hover { border-color: var(--gold); text-decoration: none; color: var(--ink); }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 6px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; min-width: 110px;
  }
  .tile .v { font-size: 21px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 64px; margin: 10px 0 2px; max-width: 640px; }
  .spark .bar {
    flex: 1; min-width: 4px; background: var(--gold-dim); border-radius: 2px 2px 0 0; position: relative;
  }
  .spark .bar:hover { background: var(--gold); }
  .spark .col { flex: 1; min-width: 4px; display: flex; flex-direction: column; justify-content: flex-end; }
  .spark .col:hover .seg-a { background: var(--gold); }
  .spark .col:hover .seg-m { background: #7ba4e8; }
  .seg-a { background: var(--gold-dim); border-radius: 0 0 1px 1px; }
  .seg-m { background: #4f79c4; border-radius: 2px 2px 0 0; }
  .legend { color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
  .sparkaxis { display: flex; justify-content: space-between; max-width: 640px;
               color: var(--muted); font-size: 11px; }
  .cluerow .q { color: var(--ink); }
  .cluerow .meta { color: var(--muted); font-size: 12px; }
  .ans { color: var(--gold); font-weight: 600; cursor: pointer; }
  .ans.hidden { color: transparent; background: var(--panel2); border-radius: 4px; }
  .ans.hidden:hover { color: var(--ink2); background: var(--panel2); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  .toolbar input {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--ink); font-size: 14px; outline: none; min-width: 260px;
  }
  .toolbar input:focus { border-color: var(--gold); }
  button, .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; font-weight: 600;
  }
  button:hover, .btn:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #1a1502; border-color: var(--gold); }
  .tabs { display: flex; gap: 6px; margin: 16px 0 8px; }
  .tabs button.active { background: var(--gold); color: #1a1502; border-color: var(--gold); }
  .assoc-clues { display: none; }
  .assoc-clues.open { display: table-row; }
  .assoc-clues td { background: #0e1836; }
  #tooltip {
    position: fixed; pointer-events: none; background: var(--panel2); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 6px; padding: 4px 10px; font-size: 12.5px;
    display: none; z-index: 20; white-space: nowrap;
  }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  #splash { text-align: center; padding: 120px 20px; color: var(--muted); font-size: 17px; }
</style>
</head>
<body>
<header>
  <h1>JEOPARDY! CANON</h1>
  <nav id="nav">
    <a href="#/" data-view="browse">Browse</a>
    <a href="#/assoc" data-view="assoc">Power Associations</a>
    <a href="#/parts" data-view="parts">Word Parts</a>
    <a href="#/clues" data-view="clues">Clue Search</a>
  </nav>
  <div id="searchwrap">
    <input id="search" type="search" placeholder="Search a person, place, work… (e.g. Mozart)" autocomplete="off">
    <div id="suggest"></div>
  </div>
</header>
<main id="main"><div id="splash">Loading the canon (~75&nbsp;MB of clues)…</div></main>
<div id="tooltip"></div>

<script src="canon_data.js"></script>
<script>
"use strict";
const D = CANON_DATA;
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- derived indexes ---------- */
const REF_YEAR = +D.ref_date.slice(0, 4);
const HL_YEARS = D.half_life_days / 365;
const yearW = y => Math.exp(-Math.LN2 * (REF_YEAR - y) / HL_YEARS);
const wScore = years => { let s = 0; for (const y in years) s += years[y] * yearW(+y); return s; };

const topicMeta = {};           // topic -> {domain,count,score,years,trend}
const domainMeta = {};          // domain -> {count,score,topics}
let totalWeighted = 0;
for (const [domain, topics] of Object.entries(D.taxonomy)) {
  domainMeta[domain] = { count: 0, score: 0, topics };
  for (const t of topics) {
    const s = D.topics[t] || { count: 0, years: {} };
    const sc = wScore(s.years);
    topicMeta[t] = { domain, count: s.count, score: sc, years: s.years, trend: topicTrend(s.years) };
    domainMeta[domain].count += s.count;
    domainMeta[domain].score += sc;
    totalWeighted += sc;
  }
}
function topicTrend(years) {
  let recent = 0, prior = 0;
  for (const y in years) {
    const age = REF_YEAR - +y;
    if (age < 5) recent += years[y]; else if (age < 15) prior += years[y];
  }
  const r = recent / 5, p = prior / 10;
  if (recent >= 20 && r > 1.4 * p) return 'rising';
  if (prior >= 40 && r < 0.6 * p) return 'declining';
  return 'stable';
}

/* Per-topic entity stats: rank inside a topic by the entity's clues IN that
   topic only (recency-weighted, mentions damped like the global score), so
   drilling into e.g. Theatre & Broadway ranks Chicago by its 24 theatre clues,
   not its 982 total appearances. */
const MENTION_W = D.mention_weight || 0.3;
const clueW = ci => yearW(+D.clues[ci][0].slice(0, 4));
const topicRank = {};           // topic -> [{i, ac, mc, s}] sorted by in-topic score
{
  const acc = {};               // topic -> Map(entity idx -> stat)
  const bump = (t, i, isAns, w) => {
    const m = acc[t] || (acc[t] = new Map());
    let x = m.get(i);
    if (!x) m.set(i, x = { i, ac: 0, mc: 0, s: 0 });
    if (isAns) { x.ac++; x.s += w; } else { x.mc++; x.s += w * MENTION_W; }
  };
  D.entities.forEach((e, i) => {
    for (const ci of e.a) bump(D.topic_names[D.clue_topics[ci]], i, true, clueW(ci));
    for (const ci of e.m) bump(D.topic_names[D.clue_topics[ci]], i, false, clueW(ci));
  });
  for (const t in acc)
    topicRank[t] = [...acc[t].values()]
      .filter(x => x.ac >= 2 || x.mc >= 5)
      .sort((a, b) => b.s - a.s);
}

const entAssocs = {};           // entity idx -> [assoc idx]
D.associations.forEach((a, ai) => a.ans.forEach(x => {
  if (x.e != null) (entAssocs[x.e] = entAssocs[x.e] || []).push(ai);
}));

/* search index: lowercase display + aliases per entity */
const searchIndex = D.entities.map((e, i) =>
  ({ i, text: (e.d + '␀' + e.al.join('␀')).toLowerCase(), score: e.s }));

/* ---------- tiny components ---------- */
const fmt = n => n.toLocaleString('en-US');
const badge = t => `<span class="badge ${t}">${t === 'rising' ? '▲ rising' : t === 'declining' ? '▼ declining' : '— stable'}</span>`;
const entLink = i => `<a href="#/entity/${i}">${esc(D.entities[i].d)}</a>`;

function sparkline(years) {
  const y0 = 1999, y1 = REF_YEAR;
  let max = 1;
  for (let y = y0; y <= y1; y++) max = Math.max(max, years[y] || 0);
  let bars = '';
  for (let y = y0; y <= y1; y++) {
    const v = years[y] || 0;
    const h = v ? Math.max(3, Math.round(v / max * 60)) : 1;
    bars += `<div class="bar" style="height:${h}px" data-tip="${y}: ${v} clue${v === 1 ? '' : 's'}"></div>`;
  }
  return `<div class="spark">${bars}</div><div class="sparkaxis"><span>${y0}</span><span>${y1}</span></div>`;
}

/* stacked answers + mentions per year */
function sparklineStacked(yAns, yMent) {
  const y0 = 1999, y1 = REF_YEAR;
  let max = 1;
  for (let y = y0; y <= y1; y++) max = Math.max(max, (yAns[y] || 0) + (yMent[y] || 0));
  let cols = '';
  for (let y = y0; y <= y1; y++) {
    const a = yAns[y] || 0, m = yMent[y] || 0;
    const ha = a ? Math.max(2, Math.round(a / max * 60)) : (m ? 0 : 1);
    const hm = m ? Math.max(2, Math.round(m / max * 60)) : 0;
    cols += `<div class="col" data-tip="${y} · ${a} as answer · ${m} mentioned">
      <div class="seg-m" style="height:${hm}px"></div>
      <div class="seg-a" style="height:${ha}px"></div>
    </div>`;
  }
  return `<div class="spark">${cols}</div>
    <div class="sparkaxis"><span>${y0}</span>
    <span class="legend"><i style="background:var(--gold-dim)"></i>as answer<i style="background:#4f79c4"></i>mentioned</span>
    <span>${y1}</span></div>`;
}

function clueRow(ci, hideAnswers) {
  const [date, cat, val, rnd, q, a] = D.clues[ci];
  return `<tr class="cluerow"><td style="min-width:170px"><div class="meta">${date} · ${esc(cat)}<br>${esc(val || 'Final Jeopardy')} · ${esc(rnd)}</div></td>
    <td><div class="q">${esc(q)}</div>
    <div class="meta">→ <span class="ans${hideAnswers ? ' hidden' : ''}" onclick="this.classList.remove('hidden')">${esc(a)}</span></div></td></tr>`;
}

function clueTable(idxs, hideAnswers, cap) {
  const shown = idxs.slice(0, cap || idxs.length);
  return `<table><tbody>${shown.map(i => clueRow(i, hideAnswers)).join('')}</tbody></table>` +
    (idxs.length > shown.length ? `<p class="sub" style="margin-top:8px">…and ${fmt(idxs.length - shown.length)} more.</p>` : '');
}

/* ---------- views ---------- */
function viewBrowse() {
  const domains = Object.entries(domainMeta).sort((a, b) => b[1].score - a[1].score);
  const maxShare = domains[0][1].score / totalWeighted;
  return `<h2>The Jeopardy! Canon</h2>
    <p class="sub">${fmt(D.clues.length)} clues, ${D.clues[0][0].slice(0,4)}–${D.ref_date} · ${fmt(D.entities.length)} recurring entities ·
    scores are recency-weighted (half-life ${HL_YEARS.toFixed(0)} yrs), so what the show asks <i>now</i> ranks first. Domains by current weight:</p>
    <div class="grid">` + domains.map(([d, m]) => {
      const share = m.score / totalWeighted;
      return `<div class="card" onclick="location.hash='#/domain/${encodeURIComponent(d)}'">
        <b>${esc(d)}</b>
        <div class="meta">${fmt(m.count)} clues · ${m.topics.length} topics · ${(share * 100).toFixed(1)}% of weight</div>
        <div class="sharebar"><i style="width:${Math.round(share / maxShare * 100)}%"></i></div>
      </div>`;
    }).join('') + `</div>
    <h3>Unclassified</h3>
    <p class="sub">${fmt((D.topics['Unclassified'] || {count:0}).count)} clues sit in one-off pun categories that don't map to a topic;
    their answers still count toward entities. Use search — every entity is findable regardless of topic.</p>`;
}

function viewDomain(domain) {
  const m = domainMeta[domain];
  if (!m) return `<div class="empty">Unknown domain.</div>`;
  const rows = m.topics.map(t => topicMeta[t])
    .sort((a, b) => b.score - a.score);
  return `<div class="crumb"><a href="#/">Canon</a> / ${esc(domain)}</div>
    <h2>${esc(domain)}</h2>
    <p class="sub">${fmt(m.count)} clues. Topics ranked by recency-weighted volume:</p>
    <table><tr><th>Topic</th><th class="num">Clues</th><th class="num">Weight</th><th>Trend</th><th>Top entities</th></tr>` +
    m.topics.map(t => ({ t, m: topicMeta[t] })).sort((a, b) => b.m.score - a.m.score).map(({ t, m }) => {
      const tops = (topicRank[t] || []).slice(0, 3).map(x => entLink(x.i)).join(', ');
      return `<tr class="rowlink" onclick="if(event.target.tagName!=='A')location.hash='#/topic/${encodeURIComponent(t)}'">
        <td><a href="#/topic/${encodeURIComponent(t)}">${esc(t)}</a></td>
        <td class="num">${fmt(m.count)}</td><td class="num">${m.score.toFixed(0)}</td>
        <td>${badge(m.trend)}</td><td>${tops}</td></tr>`;
    }).join('') + `</table>`;
}

const FORMAT_TOPICS = new Set(['Before & After', 'Rhymes, Puns & Puzzles', 'Letter-Count Words',
  'Common Bonds & Stupid Answers', 'Hodgepodge']);

function baComponents() {
  if (!D.before_after || !D.before_after.length) return '';
  return `<h3>Most common building blocks (${fmt(D.before_after.length)})</h3>
    <p class="sub">Before &amp; After answers weld two canon facts at a shared word — study the halves.
    Each row: how often the entity is one half, with example combos.</p>
    <table><tr><th>Entity</th><th class="num">Used as a half</th><th>Example combos</th></tr>` +
    D.before_after.slice(0, 100).map(b =>
      `<tr><td>${entLink(b.e)}</td><td class="num">${b.n}×</td>
       <td>${b.x.map(ci => esc(D.clues[ci][5])).join(' · ')}</td></tr>`).join('') +
    `</table>`;
}

function viewTopic(topic, showN) {
  const m = topicMeta[topic];
  if (!m) return `<div class="empty">Unknown topic.</div>`;
  const rows = topicRank[topic] || [];
  const n = showN || 50;
  const formatNote = FORMAT_TOPICS.has(topic)
    ? `<p class="sub">This is a <b>format</b> topic — its clues test regular facts wearing a wordplay gimmick.
       The entities below are the answers that recur most <i>inside this format</i>; their knowledge-topic
       homes are on their entity pages.</p>` : '';
  return `<div class="crumb"><a href="#/">Canon</a> / <a href="#/domain/${encodeURIComponent(m.domain)}">${esc(m.domain)}</a> / ${esc(topic)}</div>
    <h2>${esc(topic)} ${badge(m.trend)}</h2>
    <p class="sub">${fmt(m.count)} clues · weight ${m.score.toFixed(0)} · asked-by-year:</p>
    ${sparkline(m.years)}
    ${formatNote}
    ${topic === 'Before & After' ? baComponents() : ''}
    <h3>Entities to know (${fmt(rows.length)})</h3>
    <p class="sub">Ranked by recency-weighted appearances <b>in this topic only</b> — answer &amp; mention counts
    below are the entity's clues filed under ${esc(topic)}, not its overall totals.
    “Share” = how much of the entity's canon lives here.</p>
    <table><tr><th>#</th><th>Entity</th><th class="num">Score here</th><th class="num">As answer</th><th class="num">Mentions</th><th class="num">Share</th><th>Trend</th></tr>` +
    rows.slice(0, n).map((x, r) => {
      const e = D.entities[x.i];
      const share = Math.round((x.ac + x.mc) / (e.ac + e.mc) * 100);
      return `<tr class="rowlink" onclick="location.hash='#/entity/${x.i}'"><td class="num">${r + 1}</td>
        <td>${entLink(x.i)}</td><td class="num">${x.s.toFixed(1)}</td>
        <td class="num">${fmt(x.ac)}</td><td class="num">${fmt(x.mc)}</td>
        <td class="num">${share}%</td><td>${badge(e.t)}</td></tr>`;
    }).join('') + `</table>` +
    (rows.length > n ? `<p style="margin-top:12px"><button onclick="render('topic','${encodeURIComponent(topic)}',${n + 100})">Show more</button></p>` : '');
}

let entityTab = 'a', hideAnswers = true, entityCtx = '', entityFilter = '';
function viewEntity(i) {
  const e = D.entities[i];
  if (!e) return `<div class="empty">Unknown entity.</div>`;
  const rank = i + 1;
  const assocs = (entAssocs[i] || []).map(ai => D.associations[ai]);
  const topics = e.tp.map(t => topicMeta[t]
    ? `<a class="chip" href="#/topic/${encodeURIComponent(t)}">${esc(t)}</a>`
    : `<span class="chip">${esc(t)}</span>`).join('');
  const clueIdxs = entityTab === 'a' ? [...e.a].reverse() : [...e.m].reverse();
  return `<div class="crumb"><a href="#/">Canon</a> / entity</div>
    <h2>${esc(e.d)}</h2>
    ${e.al.length ? `<p class="sub">aka: ${esc(e.al.join(', '))}</p>` : ''}
    <div>${topics}</div>
    <div class="tiles">
      <div class="tile"><div class="v">#${fmt(rank)}</div><div class="l">canon rank</div></div>
      <div class="tile"><div class="v">${e.s.toFixed(1)}</div><div class="l">weighted score</div></div>
      <div class="tile"><div class="v">${fmt(e.ac)}</div><div class="l">times the answer</div></div>
      <div class="tile"><div class="v">${fmt(e.mc)}</div><div class="l">clue mentions</div></div>
      <div class="tile"><div class="v">${badge(e.t)}</div><div class="l">trend</div></div>
    </div>
    <p class="sub">Appearances by year — as the correct response and as a mention in other clues:</p>
    ${sparklineStacked(e.y, e.ym || {})}
    ${assocs.length ? `<h3>Cues that point here</h3>` + assocs.map(a =>
      `<span class="chip">“${esc(a.cue)}” (${a.n}×) → ${a.ans.map(x => esc(x.d) + ' ×' + x.n).join(', ')}</span>`).join(' ') : ''}
    <div class="tabs">
      <button class="${entityTab === 'a' ? 'active' : ''}" onclick="entityTab='a';entityCtx='';render('entity',${i})">As the answer (${fmt(e.ac)})</button>
      <button class="${entityTab === 'm' ? 'active' : ''}" onclick="entityTab='m';entityCtx='';render('entity',${i})">Mentioned in clues (${fmt(e.mc)})</button>
      <button onclick="hideAnswers=!hideAnswers;render('entity',${i})">${hideAnswers ? 'Show' : 'Hide'} answers</button>
    </div>
    ${contextChips(clueIdxs, i)}
    <div class="toolbar"><input id="ef" placeholder="Filter these clues… (e.g. windy, musical)" value="${esc(entityFilter)}"></div>
    ${clueTable(filterClues(clueIdxs), hideAnswers, 250)}`;
}

/* Group an entity's clues by the topic of the category they were asked
   under — this separates senses that share a name, e.g. Chicago the city
   (World Cities clues) vs Chicago the musical (Theatre & Broadway clues). */
function contextGroups(clueIdxs) {
  const groups = {};
  for (const ci of clueIdxs) {
    const t = D.topic_names[D.clue_topics[ci]];
    (groups[t] = groups[t] || []).push(ci);
  }
  const named = Object.entries(groups)
    .filter(([t, l]) => t !== 'Unclassified' && !FORMAT_TOPICS.has(t) &&
                        (l.length >= 3 || l.length >= clueIdxs.length * 0.1))
    .sort((a, b) => b[1].length - a[1].length);
  return named;
}

function contextChips(clueIdxs, i) {
  const named = contextGroups(clueIdxs);
  if (named.length < 2) return '';
  const jsq = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const chip = (label, key, n) =>
    `<a class="chip" style="${entityCtx === key ? 'border-color:var(--gold);color:var(--ink)' : ''}"
       href="javascript:void(0)" onclick="entityCtx='${esc(jsq(key))}';render('entity',${i})">${esc(label)}${n != null ? ' · ' + n : ''}</a>`;
  return `<p class="sub" style="margin:6px 0 2px">This name is asked about in ${named.length} distinct contexts — click to isolate one:</p>
    <div>${chip('All contexts', '', clueIdxs.length)}${named.slice(0, 10).map(([t, l]) => chip(t, t, l.length)).join('')}
    ${named.length > 10 ? `<span class="chip">+${named.length - 10} smaller</span>` : ''}</div>`;
}

function filterClues(clueIdxs) {
  let out = clueIdxs;
  if (entityCtx) out = out.filter(ci => D.topic_names[D.clue_topics[ci]] === entityCtx);
  const f = entityFilter.trim().toLowerCase();
  if (f) out = out.filter(ci => {
    const c = D.clues[ci];
    return c[4].toLowerCase().includes(f) || c[1].toLowerCase().includes(f) || c[5].toLowerCase().includes(f);
  });
  return out;
}

let assocFilter = '';
function viewAssoc() {
  const f = assocFilter.toLowerCase();
  const list = D.associations.filter(a => !f ||
    a.cue.toLowerCase().includes(f) || a.ans.some(x => x.d.toLowerCase().includes(f)));
  return `<h2>Power Associations</h2>
    <p class="sub">Recurring cue phrases whose answers concentrate on a tiny set — "hear the cue, know the answer".
    Mined from ${fmt(D.clues.length)} clues; ranked by recency-weighted payoff.</p>
    <div class="toolbar"><input id="af" placeholder="Filter cues or answers… (e.g. painter)" value="${esc(assocFilter)}"></div>
    <table><tr><th>Cue</th><th class="num">Seen</th><th>Usually means…</th><th></th></tr>` +
    list.slice(0, 400).map((a, r) => {
      const ai = D.associations.indexOf(a);
      return `<tr><td><b>${esc(a.cue)}</b></td><td class="num">${a.n}×</td>
        <td>${a.ans.map(x => (x.e != null ? entLink(x.e) : esc(x.d)) + ` <span class="sub">×${x.n}</span>`).join(' · ')}</td>
        <td><button onclick="document.getElementById('ac${ai}').classList.toggle('open')">clues</button></td></tr>
        <tr class="assoc-clues" id="ac${ai}"><td colspan="4">${clueTable(a.c, true, 12)}</td></tr>`;
    }).join('') + `</table>` +
    (list.length > 400 ? `<p class="sub" style="margin-top:10px">Showing 400 of ${fmt(list.length)} — filter to narrow.</p>` : '');
}

let partsFilter = '';
function viewParts() {
  if (!D.affixes || !D.affixes.length)
    return `<div class="empty">No word-part data — rebuild canon_data.js (python -m canon.build).</div>`;
  const f = partsFilter.trim().toLowerCase();
  const jsq = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const wordChip = w => {
    const label = `${esc(w.d)} <span class="sub">×${w.n}</span>`;
    if (w.e != null) return `<a href="#/entity/${w.e}">${label}</a>`;
    return `<a href="javascript:void(0)" onclick="clueQuery='${esc(jsq(w.d))}';location.hash='#/clues';render('clues')">${label}</a>`;
  };
  const section = kind => {
    const fams = D.affixes.filter(a => a.kind === kind &&
      (!f || a.x.includes(f) || a.m.toLowerCase().includes(f) || a.w.some(w => w.d.toLowerCase().includes(f))));
    if (!fams.length) return '';
    return `<h3>${kind === 'prefix' ? 'Prefixes' : 'Suffixes'}</h3>
      <table><tr><th>Part</th><th>Means</th><th class="num">Answers</th><th>Words the show asks (× times as an answer)</th></tr>` +
      fams.map(a => `<tr><td style="white-space:nowrap"><b>${esc(a.x)}</b></td><td>${esc(a.m)}</td>
        <td class="num">${fmt(a.n)}</td>
        <td>${a.w.map(wordChip).join(' · ')}</td></tr>`).join('') + `</table>`;
  };
  return `<h2>Word Parts</h2>
    <p class="sub">Greek &amp; Latin building blocks behind recurring answers — big in science and vocabulary
    categories. Decode the part, decode the word: arachno- (spider) + -phobia (fear of). Words link to their
    entity page, or to a clue search if they're below the canon threshold.</p>
    <div class="toolbar"><input id="pf" placeholder="Filter parts, meanings or words… (e.g. fear)" value="${esc(partsFilter)}"></div>`
    + section('prefix') + section('suffix');
}
function wirePartsFilter() {
  const inp = $('#pf');
  if (!inp) return;
  let t;
  inp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { partsFilter = inp.value; render('parts');
      const n = $('#pf'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250);
  });
}

let clueQuery = '';
function viewClueSearch() {
  let body = '';
  if (clueQuery.trim().length >= 2) {
    const q = clueQuery.trim().toLowerCase();
    const hits = [];
    for (let i = D.clues.length - 1; i >= 0 && hits.length < 300; i--) {
      const c = D.clues[i];
      if (c[4].toLowerCase().includes(q) || c[5].toLowerCase().includes(q) || c[1].toLowerCase().includes(q)) hits.push(i);
    }
    body = `<p class="sub">${hits.length === 300 ? '300+ ' : hits.length + ' '}matches, newest first.</p>` + clueTable(hits, false, 300);
  } else body = `<div class="empty">Type at least 2 characters, then press Enter.</div>`;
  return `<h2>Clue Search</h2>
    <p class="sub">Raw substring search across every question, answer &amp; category.</p>
    <div class="toolbar">
      <input id="cq" placeholder="e.g. pyrenees" value="${esc(clueQuery)}">
      <button class="primary" onclick="clueQuery=document.getElementById('cq').value;render('clues')">Search</button>
    </div>${body}`;
}

/* ---------- router ---------- */
function render(view, arg, extra) {
  const main = $('#main');
  if (view === 'browse') main.innerHTML = viewBrowse();
  else if (view === 'domain') main.innerHTML = viewDomain(decodeURIComponent(arg));
  else if (view === 'topic') main.innerHTML = viewTopic(decodeURIComponent(arg), extra);
  else if (view === 'entity') { main.innerHTML = viewEntity(+arg); wireEntityFilter(+arg); }
  else if (view === 'assoc') { main.innerHTML = viewAssoc(); wireAssocFilter(); }
  else if (view === 'parts') { main.innerHTML = viewParts(); wirePartsFilter(); }
  else if (view === 'clues') { main.innerHTML = viewClueSearch(); wireClueSearch(); }
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.view === view ||
      (a.dataset.view === 'browse' && ['domain', 'topic', 'entity'].includes(view))));
  window.scrollTo(0, 0);
}
function route() {
  const h = location.hash.slice(2) || '';
  const [view, arg] = h.split('/');
  if (view === 'domain') render('domain', arg);
  else if (view === 'topic') { entityTab = 'a'; render('topic', arg); }
  else if (view === 'entity') { entityTab = 'a'; entityCtx = ''; entityFilter = ''; render('entity', arg); }
  else if (view === 'assoc') render('assoc');
  else if (view === 'parts') render('parts');
  else if (view === 'clues') render('clues');
  else render('browse');
}
window.addEventListener('hashchange', route);

function wireAssocFilter() {
  const inp = $('#af');
  let t;
  inp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { assocFilter = inp.value; render('assoc');
      const n = $('#af'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250);
  });
}
function wireEntityFilter(i) {
  const inp = $('#ef');
  if (!inp) return;
  let t;
  inp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { entityFilter = inp.value; render('entity', i);
      const n = $('#ef'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250);
  });
}
function wireClueSearch() {
  $('#cq').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { clueQuery = ev.target.value; render('clues'); }
  });
}

/* ---------- global entity search ---------- */
const searchBox = $('#search'), suggest = $('#suggest');
let selIdx = -1, results = [];
function runSearch(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) { suggest.style.display = 'none'; return; }
  results = [];
  for (const s of searchIndex) {
    if (s.text.includes(q)) {
      results.push(s);
      if (results.length > 400) break;
    }
  }
  // exact / prefix matches first, then by canon score
  results.sort((a, b) => {
    const ax = D.entities[a.i].d.toLowerCase(), bx = D.entities[b.i].d.toLowerCase();
    const r = (bx === q) - (ax === q) || (bx.startsWith(q)) - (ax.startsWith(q));
    return r !== 0 ? -r : b.score - a.score;
  });
  results = results.slice(0, 12);
  const cues = D.associations.filter(a => a.cue.toLowerCase().includes(q)).slice(0, 3);
  selIdx = -1;
  suggest.innerHTML = results.map((s, r) => {
    const e = D.entities[s.i];
    return `<div class="sg" data-i="${s.i}"><span>${esc(e.d)}</span>
      <small>${esc(e.tp[0] || '')} · ${fmt(e.ac)}× answer</small></div>`;
  }).join('') + cues.map(a =>
    `<div class="sg" data-cue="1"><span>“${esc(a.cue)}” → ${esc(a.ans[0].d)}…</span><small>association</small></div>`).join('');
  suggest.style.display = (results.length + cues.length) ? 'block' : 'none';
  suggest.querySelectorAll('.sg').forEach(el => el.addEventListener('mousedown', () => {
    if (el.dataset.cue) { assocFilter = searchBox.value.trim(); location.hash = '#/assoc'; render('assoc'); }
    else location.hash = '#/entity/' + el.dataset.i;
    suggest.style.display = 'none'; searchBox.blur();
  }));
}
searchBox.addEventListener('input', () => runSearch(searchBox.value));
searchBox.addEventListener('focus', () => runSearch(searchBox.value));
searchBox.addEventListener('blur', () => setTimeout(() => suggest.style.display = 'none', 150));
searchBox.addEventListener('keydown', ev => {
  const items = suggest.querySelectorAll('.sg');
  if (ev.key === 'ArrowDown') { selIdx = Math.min(selIdx + 1, items.length - 1); }
  else if (ev.key === 'ArrowUp') { selIdx = Math.max(selIdx - 1, 0); }
  else if (ev.key === 'Enter' && items[Math.max(selIdx, 0)]) {
    items[Math.max(selIdx, 0)].dispatchEvent(new Event('mousedown')); return;
  } else return;
  ev.preventDefault();
  items.forEach((el, i) => el.classList.toggle('sel', i === selIdx));
  if (items[selIdx]) items[selIdx].scrollIntoView({ block: 'nearest' });
});

/* ---------- sparkline tooltip ---------- */
const tip = $('#tooltip');
document.addEventListener('mouseover', ev => {
  const t = ev.target.closest('[data-tip]');
  if (t) { tip.textContent = t.dataset.tip; tip.style.display = 'block'; }
  else tip.style.display = 'none';
});
document.addEventListener('mousemove', ev => {
  if (tip.style.display === 'block') {
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - 160) + 'px';
    tip.style.top = (ev.clientY + 14) + 'px';
  }
});

route();
</script>
</body>
</html>
